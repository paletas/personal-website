# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy docker image - silvestre-website

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Get version from csproj
      id: version
      run: |
        $xml=[xml](Get-Content .\Silvestre.App.Web.csproj)
        $version=$xml.Project.PropertyGroup.Version
        echo "project_version=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
      working-directory: src/Silvestre.App.Web
    - name: Docker tags
      id: tags
      shell: bash
      run: |
        version='${{ steps.version.outputs.project_version }}'
        majorminor=$(echo "$version" | cut -d. -f1,2)
        image=ghcr.io/paletas/personal-website
        if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
          tags="$image:${version}dev,$image:${majorminor}dev,$image:beta"
        else
          tags="$image:$version,$image:$majorminor"
        fi
        echo "DOCKER_TAGS=$tags" >> "$GITHUB_OUTPUT"
    - name: Prints
      run: |
          echo "The version is ${{ steps.version.outputs.project_version }}"
          echo "The tags are ${{ steps.tags.outputs.DOCKER_TAGS }}"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: linux/amd64,linux/arm64/v8
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GitHub Container Registry
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64/v8
        file: src/Silvestre.App.Web/Dockerfile
        push: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' }}
        tags: ${{ steps.tags.outputs.DOCKER_TAGS }}

