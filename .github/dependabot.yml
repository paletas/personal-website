# Public site: Dependabot version updates every other day (06:00 Lisbon). PRs go to dev; minor/patch grouped per ecosystem.
# npm (Tailwind CSS, charts.css) is built into the Docker image and tracked here.
# Security fixes are raised by Dependabot separately and are not limited by this schedule.
version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/src/*"]
    target-branch: dev
    schedule:
      interval: cron
      cronjob: "0 6 */2 * *"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/src/Silvestre.App.Web"
    target-branch: dev
    schedule:
      interval: cron
      cronjob: "0 6 */2 * *"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: dotnet-sdk
    directory: "/"
    target-branch: dev
    schedule:
      interval: cron
      cronjob: "0 6 */2 * *"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories: ["/src/Silvestre.App.Blog.Web", "/src/Silvestre.App.Web"]
    target-branch: dev
    schedule:
      interval: cron
      cronjob: "0 6 */2 * *"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: cron
      cronjob: "0 6 */2 * *"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
